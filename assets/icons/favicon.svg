<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232329"/>
      <stop offset="12%" stop-color="#17171b"/>
      <stop offset="88%" stop-color="#17171b"/>
      <stop offset="100%" stop-color="#0d0d10"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#case)" stroke="#000" stroke-width="2"/>

  <g filter="url(#glow)">
    <!-- stopwatch crown -->
    <rect x="43" y="10" width="14" height="10" rx="3" fill="#ffb000"/>
    <!-- stopwatch side button -->
    <rect x="66" y="20" width="10" height="8" rx="2.5" fill="#ffb000" transform="rotate(35 71 24)"/>
    <!-- watch face -->
    <circle cx="50" cy="58" r="30" fill="none" stroke="#ffb000" stroke-width="6"/>
    <!-- hand -->
    <line x1="50" y1="58" x2="50" y2="38" stroke="#ffb000" stroke-width="5" stroke-linecap="round"/>
    <line x1="50" y1="58" x2="64" y2="50" stroke="#ffb000" stroke-width="5" stroke-linecap="round"/>
    <circle cx="50" cy="58" r="4.5" fill="#ffb000"/>
  </g>

  <!-- fast/slow lap dots -->
  <circle cx="30" cy="86" r="4" fill="#ff3b30"/>
  <circle cx="70" cy="86" r="4" fill="#33ff99"/>
</svg>
